<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Character Wheels</title>
<style>
  :root { --bg:#14122b; --panel:#221f47; --ink:#f6f1ff; --dim:#aaa6d6; --gold:#ff7eb6; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; padding:24px 16px 48px; }
  main { max-width: 1000px; margin: 0 auto; text-align:center; }
  .layout { display:grid; grid-template-columns:minmax(0, 640px) 300px; gap:16px; justify-content:center; align-items:start; }
  .layout .sheet { margin-top:16px; }
  .saved { background:var(--panel); border-radius:16px; padding:16px; text-align:left; position:sticky; top:16px; }
  .saved h3 { margin:0 0 10px; font-size:18px; font-weight:normal; }
  .saved h3 span { color:var(--dim); }
  .saved ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; max-height:70vh; overflow:auto; }
  .saved li { display:flex; gap:4px; border-radius:8px; background:#2c2859; }
  .saved li.on { outline:2px solid var(--gold); }
  .saved li.empty { background:none; color:var(--dim); font-size:14px; }
  .saved .pick { flex:1; min-width:0; text-align:left; background:none; padding:8px 10px; display:grid; gap:2px; }
  .saved .pick span { word-break:break-word; }
  .saved .pick small { color:var(--dim); font-size:12px; }
  .saved .rm { background:none; padding:4px 10px; color:var(--dim); font-size:18px; }
  .saved .rm:hover, .saved .pick:hover { background:#3b3670; }
  @media (max-width: 980px) { .layout { grid-template-columns:minmax(0, 640px); } .saved { position:static; } }
  h1 { font-size: clamp(28px, 6vw, 44px); margin: 0 0 6px; }
  .sub { color:var(--dim); margin:0 0 20px; }
  .stage { background:var(--panel); border-radius:16px; padding:18px 14px 20px; transition:opacity .25s; }
  .stage.out { opacity:0; }
  .step { color:var(--dim); font-size:14px; }
  h2 { margin:2px 0 10px; font-size:28px; font-weight:normal; }
  .wrap { position:relative; width:min(86vw, 360px); margin:0 auto; }
  canvas { width:100%; aspect-ratio:1; display:block; margin-top:14px; }
  .pin { position:absolute; left:50%; top:0; transform:translateX(-50%); width:0; height:0; z-index:2;
         border-left:11px solid transparent; border-right:11px solid transparent; border-top:22px solid var(--gold); filter:drop-shadow(0 0 6px #ff7eb6); }
  .live { font-size:24px; min-height:36px; margin:14px 0 12px; color:var(--dim); }
  .live.done { color:var(--gold); }
  .row { flex-wrap:wrap; display:flex; gap:16px; justify-content:center; align-items:center; color:var(--dim); font-size:15px; }
  button { font: inherit; cursor:pointer; border:0; border-radius:8px; padding:8px 16px; background:#3b3670; color:var(--ink); }
  button:hover { background:#4d4796; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .big { background:var(--gold); color:#14122b; font-size:20px; padding:11px 34px; font-weight:bold; }
  .big:hover:not(:disabled) { background:#ff9fca; }
  .sheet { background:var(--panel); border-radius:16px; padding:16px 20px 20px; margin-top:16px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; text-align:left; margin:0 0 14px; }
  dd.stat { display:flex; align-items:center; gap:12px; }
  dd.stat b { font-weight:normal; min-width:2.2em; }
  .track { flex:1; max-width:220px; height:8px; border-radius:4px; background:#3b3670; overflow:hidden; }
  .track i { display:block; height:100%; background:var(--gold); }
  .num { font-size:13px; color:var(--dim); word-break:break-all; margin:0 0 14px; text-align:left; }
  .num b { color:var(--gold); font-weight:normal; }
  .names { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:6px 0 12px; }
  .names .wrap { width:100%; }
  .names .pin { border-left-width:8px; border-right-width:8px; border-top-width:16px; }
  .names .live { font-size:16px; min-height:44px; margin:8px 0 0; word-break:break-word; }
  .names .cap { color:var(--dim); font-size:14px; }
  @media (max-width: 560px) { .names { grid-template-columns:1fr; justify-items:center; } .names > div { width:min(72vw, 240px); } }
  .load { display:flex; gap:8px; margin:0 0 12px; }
  .load input { flex:1; min-width:0; background:#14122b; color:var(--ink); border:1px solid #3b3670; border-radius:8px; padding:8px 10px; font:inherit; }
  .err { color:#ff9fa0; font-size:14px; margin:-4px 0 12px; text-align:left; }
  .dec { font-size:11px; color:var(--dim); opacity:.85; word-break:break-all; margin:10px 0 0; text-align:left; }
  .tip { position:fixed; z-index:10; width:380px; max-width:calc(100vw - 16px); background:#1a1838; border:1px solid #3b3670; border-radius:12px; padding:12px 14px 14px; pointer-events:none; box-shadow:0 8px 28px rgba(0,0,0,.5); text-align:left; }
  .tip h4 { margin:0 0 8px; font-size:15px; font-weight:normal; word-break:break-word; }
  .tip .g { display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; }
  .tip .st { display:grid; grid-template-columns:1fr auto; font-size:12px; color:var(--dim); }
  .tip .st b { color:var(--ink); font-weight:normal; }
  .tip .st i { grid-column:1 / -1; display:block; height:5px; margin-top:3px; border-radius:3px; background:linear-gradient(var(--gold), var(--gold)) 0 0 / var(--v) 100% no-repeat, #3b3670; }
  @media (max-width: 420px) { .tip .g { grid-template-columns:1fr; } }
  .saved .lbl { color:var(--dim); font-size:13px; margin:14px 0 6px; }
  .saved textarea { width:100%; resize:none; background:#14122b; color:var(--dim); border:1px solid #3b3670; border-radius:8px; padding:6px 8px; font:11px/1.35 ui-monospace, Consolas, monospace; word-break:break-all; margin-bottom:8px; }
  .saved .load { margin:0; }
  .saved .msg { font-size:13px; color:var(--dim); margin:8px 0 0; }
  .saved .msg.bad { color:#ff9fa0; }
  dt { color:var(--dim); } dd { margin:0; } dd.set { color:var(--gold); }
  .sheet .row { gap:10px; }
</style>
</head>
<body>
<main>
  <h1>Anime Character Wheels</h1>
  <p class="sub">One wheel at a time. A Yes on a yes/no wheel unlocks a follow-up wheel, and there are twenty stats from 0 to 100 at the end.<br><span id="total"></span></p>

  <div class="layout"><div class="col">
  <section class="stage" id="stage">
    <div class="step" id="step"></div>
    <h2 id="wname"></h2>
    <div class="wrap" id="mainWrap"><div class="pin"></div><canvas id="cv"></canvas></div>
    <div class="live" id="live"></div>
    <div class="names" id="names" hidden></div>
    <div class="row"><button class="big" id="spin">Spin</button><button id="spinAll" title="Roll every remaining wheel instantly">Spin all</button><label><input type="checkbox" id="auto"> Auto-spin</label></div>
  </section>

  <section class="sheet">
    <dl id="rows"></dl>
    <p class="num" id="charNum" hidden></p>
    <div class="load"><input id="numIn" inputmode="numeric" autocomplete="off" placeholder="Paste a character code or number" aria-label="Character code or number"><button id="load">Show character</button></div>
    <p class="err" id="numErr" hidden></p>
    <div class="row"><button id="copy">Copy character</button><button id="save" disabled>Save</button><button id="again" hidden>New character</button></div>
    <p class="dec" id="decNum" hidden></p>
  </section>
  </div>
  <aside class="saved" aria-label="Saved characters">
    <h3>Saved characters <span id="savedCount"></span></h3>
    <ul id="savedList"></ul>
    <div class="listid" id="listId" hidden>
      <div class="lbl">List code</div>
      <textarea id="listCode" readonly rows="3" aria-label="List code"></textarea>
      <button id="copyList">Copy list code</button>
    </div>
    <div class="listload">
      <div class="lbl">Load a saved list</div>
      <div class="load"><input id="listIn" autocomplete="off" placeholder="Paste a list code" aria-label="List code to load"><button id="loadList">Load</button></div>
      <p class="msg" id="listMsg" hidden></p>
    </div>
  </aside>
  </div>
</main>
<div class="tip" id="tip" hidden></div>

<script>

const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const FU = {
  "Companion": { name:"Companion type", q:"What is the mascot companion?", o: X(["Talking cat","Fox spirit","Mini dragon","Floating robot","Ghost kid","Slime","Giant dog","Fairy","Tanuki","Crow","Living plushie","Panda","Owl familiar","Tiny golem","Phoenix chick","Spirit rabbit","Mechanical bird","Baby kraken","Cat girl","Wolf pup"], ["who loves snacks","only they can see","who talks too much","who is secretly powerful","who is always sleepy","who is very brave","who is terrified of everything","who gives bad advice","who is actually a god","who is evolving"], (a,b) => `${a} ${b}`) },
  "Power": { name:"Power type", q:"What is their special power?", o: X(["Fire control","Time stop","Shadow stepping","Gravity control","Mind reading","Super speed","Copying powers","Healing","Lightning","Ice","Soul sight","Shapeshifting","Illusions","Super strength","Wind control","Plant control","Dimension doors","Telekinesis","Blood magic","Sound waves"], ["drains their life","only works at night","needs a hand sign","grows with emotion","has a secret weakness","forbidden by the council","inherited from a clan","awakened in battle","needs a chant","sealed at first"], (a,b) => `${a} (${b})`) },
  "Villain": { name:"Villain type", q:"What kind of villain?", o: X(["Demon king","Cult leader","Corrupt noble","Evil scientist","Rogue hero","Mastermind","Fallen angel","Crime lord","Dark sorcerer","Warlord","Evil clone","Shadow organization boss","Rogue AI","Time traveler","Corrupted god","Vampire lord","Pirate king","Mad emperor","Twisted teacher","Masked schemer"], ["seeking power","seeking revenge","who loves chaos","who wants to rule","who wants to live forever","who thinks they're the hero","driven by grief","hired by someone worse","who wants to burn it all","who just wants respect"], (a,b) => `${a} ${b}`) },
  "Chosen one": { name:"Prophecy", q:"Why are they the chosen one?", o: X(["Chosen by a sacred sword","Chosen by a dying god","Born under a red moon","Marked by a seal","Foretold in a scroll","Awakened by a meteor","Chosen by a spirit","Last of a clan","Holder of a demon","A reincarnated hero","Child of two worlds","Keeper of the gate","Summoned hero","Bearer of the star","Heir to a lost power","Wielder of a forbidden book","Vessel of a sleeping dragon","Blessed by the moon","Marked by fate","Sworn guardian"], ["and the world is hunting them","but nobody believes it","and they must hide it","but they refuse the role","and a rival wants it","but the power is fading","and a countdown has started","but they don't know yet","and a villain knows","and everyone depends on them"], (a,b) => `${a} ${b}`) },
  "Flying": { name:"Flight method", q:"How do they fly?", o: X(["Wings of light","Demon wings","Magic broom","Cloud riding","Flight spell","Rocket boots","Winged familiar","Mecha flight pack","Wind aura","Spirit wings","Giant bird","Dragon rider","Floating sword","Anti-gravity","Angel halo","Feathered cloak","Floating umbrella","Hot-air balloon","Gliding cape","Ghostly float"], ["only at night","poorly","very fast","short distances only","afraid of heights","silently","only when happy","very loudly","for ten minutes","only in storms"], (a,b) => `${a} (${b})`) },
  "Cursed": { name:"Curse", q:"What is the curse or seal?", o: X(["Demon sealed in their arm","Cursed left eye","Burning mark","Sealed memories","Cursed necklace","Hungry blade","Voice of a spirit","Fox spirit bound","Dragon sleeping inside","Cannot use magic","Aging fast","Turning to light","Ghost possession","Seal on their heart","Bad luck aura","Blood curse","Moon curse","Fading existence","Forbidden contract","Shadow clone curse"], ["acts up when angry","acts up at night","acts up at full moon","acts up when they cry","acts up near danger","acts up when they lie","acts up at sunrise","acts up when hungry","acts up when they fight","acts up when they smile"], (a,b) => `${a} (${b})`) },
  "Transform": { name:"Transformation", q:"What is their transformation?", o: X(["Final form","Beast mode","Armor form","Angel form","Demon form","Giant form","Chibi form","Mecha suit","Magical outfit","Dragon form","Shadow form","Golden aura","Spirit form","Ice form","Fire form","Wolf form","Light form","Dual form","Gear shift","Kaiju form"], ["when they shout a catchphrase","when protecting a friend","when badly hurt","with a dramatic pose","at midnight","when they are happy","when they cry","after eating","at full moon","only once a day"], (a,b) => `${a} ${b}`) }
};
const W = [...MAIN];
const addPair = (y, f) => { W.push(y); f.req = W.length - 1; f.label = f.label || f.name; W.push(f); };
addPair(ARM, WPN);
YN.forEach(y => addPair(y, { ...FU[y.label], hue: y.hue + 18 }));
W.push(...ST);
const cultureOf = o => CULT[Object.keys(CULT).find(r => o.endsWith(r))];
function opts(i) {
  const w = W[i]; if (!w.dyn) return;
  const c = cultureOf(W[0].o[res[0]]);
  w.o = NAMES[c][w.dyn];
  if (w.dyn === "last") w.name = w.label = c === "machine" ? "Serial number" : "Last name";
}
const SIZE = 360, dpr = window.devicePixelRatio || 1;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
cv.width = cv.height = SIZE * dpr;

const skipped = i => W[i].req !== undefined && res[W[i].req] % 2 === 1;
let cur = 0, res = [], busy = false, angle = 0;

function pickIndex(a, n) {
  const S = Math.PI * 2 / n, x = ((-Math.PI / 2 - a) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(x / S) % n;
}

const SM = 200, gctx = [], liveEls = [], capEls = [], gang = [0, 0, 0];
const NAMEIDX = W.map((w, i) => w.dyn ? i : -1).filter(i => i >= 0);
W[NAMEIDX[0]].group = NAMEIDX;
NAMEIDX.slice(1).forEach(i => W[i].follower = true);
NAMEIDX.forEach(i => {
  const d = document.createElement("div");
  d.innerHTML = `<div class="cap">${W[i].name}</div><div class="wrap"><div class="pin"></div><canvas></canvas></div><div class="live"></div>`;
  $("names").appendChild(d);
  const c = d.querySelector("canvas"); c.width = c.height = SM * dpr;
  gctx.push(c.getContext("2d")); liveEls.push(d.querySelector(".live")); capEls.push(d.querySelector(".cap"));
});

function draw(c, w, a, size) {
  const n = w.o.length, S = Math.PI * 2 / n, r = size / 2, big = size >= 300, hub = big ? 14 : 9;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, size, size);
  for (let k = 0; k < n; k++) {
    const s = a + k * S;
    c.beginPath(); c.moveTo(r, r); c.arc(r, r, r - 4, s, s + S); c.closePath();
    c.fillStyle = `hsl(${w.hue + (k * 7) % 40}, ${k % 2 ? 48 : 58}%, ${k % 2 ? 32 : 44}%)`; c.fill();
    if (n <= 12) {
      c.strokeStyle = "#14122b"; c.lineWidth = 2; c.stroke();
      c.save(); c.translate(r, r); c.rotate(s + S / 2);
      const base = big ? (n <= 6 ? 22 : 15) : 12, off = big ? 24 : 10, maxW = r - off - hub - 6;
      c.fillStyle = "#fff"; c.font = `${base}px Trebuchet MS, sans-serif`;
      const tw = c.measureText(w.o[k]).width;
      if (tw > maxW) c.font = `${(base * maxW / tw).toFixed(1)}px Trebuchet MS, sans-serif`;
      c.textAlign = "right"; c.textBaseline = "middle"; c.fillText(w.o[k], r - off, 0); c.restore();
    }
  }
  c.beginPath(); c.arc(r, r, hub, 0, 7); c.fillStyle = "#14122b"; c.fill();
}

function rows() {
  $("rows").innerHTML = W.map((w, i) => {
    const v = res[i];
    if (w.follower) return "";
    if (w.req !== undefined && !(res[w.req] !== undefined && res[w.req] % 2 === 0)) return "";
    if (w.group) {
      const done = w.group.every(j => res[j] !== undefined);
      return `<dt>Name</dt><dd class="${done ? "set" : ""}">${done ? w.group.map(j => W[j].o[res[j]]).join(" ") : "–"}</dd>`;
    }
    if (w.stat) return `<dt>${w.label}</dt>` + (v === undefined ? `<dd>–</dd>` : `<dd class="set stat"><b>${v}</b><span class="track"><i style="width:${v}%"></i></span></dd>`);
    const txt = v === undefined ? "–" : v === -1 ? "Unarmed" : cap(w.o[v]);
    return `<dt>${w.label || w.name}</dt><dd class="${v === undefined ? "" : "set"}">${txt}</dd>`;
  }).join("");
}

function show() {
  const idxs = W[cur].group || [cur], isG = !!W[cur].group;
  idxs.forEach(i => opts(i));
  $("mainWrap").hidden = isG; $("live").hidden = isG; $("names").hidden = !isG;
  const live = (_, i) => !skipped(i) && !W[i].follower;
  $("step").textContent = `Wheel ${W.slice(0, cur + 1).filter(live).length} of ${W.filter(live).length}`;
  $("wname").textContent = isG ? "Name" : (W[cur].q || W[cur].name);
  if (isG) {
    idxs.forEach((wi, j) => {
      gang[j] = Math.random() * 6.28; draw(gctx[j], W[wi], gang[j], SM);
      capEls[j].textContent = W[wi].name;
      liveEls[j].textContent = `${W[wi].o.length} options`; liveEls[j].classList.remove("done");
    });
  } else {
    angle = Math.random() * 6.28;
    $("live").textContent = `${W[cur].o.length} options`; $("live").classList.remove("done");
    draw(ctx, W[cur], angle, SIZE);
  }
  $("spin").disabled = false; $("spinAll").disabled = false;
}

function spin() {
  if (busy) return; busy = true; $("spin").disabled = true; $("spinAll").disabled = true;
  const idxs = W[cur].group || [cur], isG = !!W[cur].group;
  Promise.all(idxs.map((i, j) => new Promise(done => {
    const w = W[i], n = w.o.length, start = isG ? gang[j] : angle;
    const total = Math.PI * 2 * (5 + Math.random() * 3) + Math.random() * 6.28;
    const dur = reduced ? 600 : 4200 + Math.random() * 800, t0 = performance.now(); let last = -1;
    const liveEl = isG ? liveEls[j] : $("live");
    (function frame(t) {
      const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3), a = start + total * e;
      if (isG) { gang[j] = a; draw(gctx[j], w, a, SM); } else { angle = a; draw(ctx, w, a, SIZE); }
      const idx = pickIndex(a, n);
      if (idx !== last) { liveEl.textContent = cap(w.o[idx]); last = idx; }
      if (p < 1) return requestAnimationFrame(frame);
      res[i] = idx; liveEl.classList.add("done"); done();
    })(t0);
  }))).then(() => { rows(); setTimeout(next, 1700); });
}

function next() {
  busy = false;
  let n = cur + (W[cur].group ? W[cur].group.length : 1);
  while (n < W.length && skipped(n)) { res[n] = -1; n++; }
  rows();
  if (n >= W.length) { finish(); return; }
  $("stage").classList.add("out");
  setTimeout(() => {
    cur = n; show(); $("stage").classList.remove("out");
    if ($("auto").checked) setTimeout(spin, 700);
  }, 260);
}

const PARENTS = new Set(W.filter(w => w.req !== undefined).map(w => w.req));
const group = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const sci = n => { const t = n.toString(); return `${t[0]}.${t.slice(1, 3)} × 10<sup>${t.length - 1}</sup>`; };
// each yes/no wheel and its follow-up count as one choice: "no", or "yes" plus one of the follow-up options
const TOTAL = W.reduce((t, w, i) => PARENTS.has(i) ? t : t * BigInt(w.o.length + (w.req !== undefined ? 1 : 0)), 1n);
$("total").innerHTML = `About ${sci(TOTAL)} possible characters.`;
const ALPHA = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"; // no 0, O, I or l, so codes are hard to misread
const toCode = n => { let t = ""; while (n > 0n) { t = ALPHA[Number(n % 58n)] + t; n /= 58n; } return t; };
const CODELEN = toCode(TOTAL - 1n).length;
const fmtCode = n => toCode(n).padStart(CODELEN, ALPHA[0]).replace(/(.{5})(?=.)/g, "$1-");
function finish() {
  curId = null; // set below once the number is known
  let id = 0n;
  W.forEach((w, i) => {
    if (PARENTS.has(i)) return;
    const n = BigInt(w.o.length), v = res[i];
    id = w.req !== undefined ? id * (n + 1n) + (v === -1 ? 0n : BigInt(v) + 1n) : id * n + BigInt(v);
  });
  $("charNum").innerHTML = `Character code <b>${fmtCode(id)}</b> (one of about ${sci(TOTAL)})`;
  curId = id; $("save").disabled = false; renderSaved();
  $("decNum").textContent = `Character number: ${group(id)}`; $("decNum").hidden = false;
  $("charNum").hidden = false; $("stage").hidden = true; $("again").hidden = false;
}
function decode(id) {
  const r = [];
  const idxs = W.map((_, i) => i).filter(i => !PARENTS.has(i));
  for (let k = idxs.length - 1; k >= 0; k--) {
    const i = idxs[k], w = W[i], n = BigInt(w.o.length + (w.req !== undefined ? 1 : 0));
    const d = Number(id % n); id /= n;
    if (w.req !== undefined) { if (d === 0) { r[i] = -1; r[w.req] = 1; } else { r[i] = d - 1; r[w.req] = 0; } }
    else r[i] = d;
  }
  return r;
}
function loadNumber() {
  const err = m => { $("numErr").textContent = m; $("numErr").hidden = !m; };
  if (busy) return err("Wait for the wheel to finish spinning first.");
  const raw = $("numIn").value.replace(/[\s#,-]/g, "");
  if (!raw) return err("Type or paste a character code first.");
  let id = 0n;
  if (/^\d+$/.test(raw)) id = BigInt(raw); // a plain number
  else for (const ch of raw) {
    const k = ALPHA.indexOf(ch);
    if (k < 0) return err(`"${ch}" isn't used in character codes. Codes never contain 0, O, I or l.`);
    id = id * 58n + BigInt(k);
  }
  if (id >= TOTAL) return err("That code doesn't match a character. Check that you copied all of it.");
  err("");
  showId(id);
}
function showId(id) {
  res = decode(id);
  W.forEach((_, i) => opts(i));
  rows(); finish();
}
const KEY = "anime-character-wheels-saved-v2";
let saved = [], curId = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function renderSaved() {
  hideTip();
  $("listId").hidden = !saved.length;
  if (saved.length) $("listCode").value = listCode();
  $("savedCount").textContent = saved.length ? `(${saved.length})` : "";
  $("savedList").innerHTML = saved.length ? saved.map((c, i) =>
    `<li class="${curId !== null && c.id === curId.toString() ? "on" : ""}"><button class="pick" data-i="${i}"><span>${esc(c.name)}</span><small>${esc(c.desc)}</small></button><button class="rm" data-i="${i}" aria-label="Remove ${esc(c.name)}">×</button></li>`).join("")
    : `<li class="empty">Nothing saved yet. Finish a character and press Save.</li>`;
}
const ROLE = W.findIndex(w => w.name === "Role");
function summarize(id) {
  const r = decode(id), c = cultureOf(W[0].o[r[0]]);
  return { id: id.toString(), name: NAMEIDX.map(i => NAMES[c][W[i].dyn][r[i]]).join(" "), desc: `${W[0].o[r[0]]}, ${W[ROLE].o[r[ROLE]]}` };
}
const chk = t => ALPHA[[...t].reduce((n, ch) => n + ALPHA.indexOf(ch), 0) % 58];
function listCode() {
  const t = saved.map(c => toCode(BigInt(c.id)).padStart(CODELEN, ALPHA[0])).join("");
  return (t + chk(t)).replace(/(.{5})(?=.)/g, "$1-");
}
function hideTip() { $("tip").hidden = true; }
function showTip(li) {
  const c = saved[+li.querySelector(".pick").dataset.i], r = decode(BigInt(c.id)), tip = $("tip");
  tip.innerHTML = `<h4>${esc(c.name)}</h4><div class="g">` + W.map((w, i) => w.stat ? `<div class="st"><span>${w.label}</span><b>${r[i]}</b><i style="--v:${r[i]}%"></i></div>` : "").join("") + `</div>`;
  tip.hidden = false;
  const b = li.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = b.left - tw - 10, top = b.top;
  if (left < 8) { left = Math.min(Math.max(8, b.left), vw - tw - 8); top = b.bottom + 8; if (top + th > vh - 8) top = Math.max(8, b.top - th - 8); }
  tip.style.left = left + "px"; tip.style.top = Math.max(8, Math.min(top, vh - th - 8)) + "px";
}
let tipLi = null;
$("savedList").onmouseover = e => {
  const li = e.target.closest("li:not(.empty)");
  if (li === tipLi) return;
  tipLi = li; li ? showTip(li) : hideTip();
};
$("savedList").onmouseleave = () => { tipLi = null; hideTip(); };
$("savedList").onfocusin = e => { const li = e.target.closest("li:not(.empty)"); if (li) { tipLi = li; showTip(li); } };
$("savedList").onfocusout = () => { tipLi = null; hideTip(); };
$("savedList").onscroll = hideTip;
$("savedList").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +b.dataset.i;
  if (b.classList.contains("rm")) { saved.splice(i, 1); persist(); renderSaved(); }
  else if (!busy) { $("numErr").hidden = true; showId(BigInt(saved[i].id)); }
};
$("save").onclick = e => {
  if (curId === null) return;
  const btn = e.currentTarget, id = curId.toString(), flash = t => { btn.textContent = t; setTimeout(() => btn.textContent = "Save", 1200); };
  if (saved.some(c => c.id === id)) return flash("Already saved");
  saved.unshift(summarize(curId));
  persist(); renderSaved(); flash("Saved");
};
$("listCode").onclick = e => e.target.select();
$("copyList").onclick = e => {
  navigator.clipboard?.writeText($("listCode").value).then(() => { e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy list code", 1200); });
};
function loadList() {
  const msg = (t, bad) => { $("listMsg").textContent = t; $("listMsg").className = "msg" + (bad ? " bad" : ""); $("listMsg").hidden = !t; };
  const raw = $("listIn").value.replace(/[\s#-]/g, "");
  if (!raw) return msg("Paste a list code first.", true);
  const bad = [...raw].find(ch => ALPHA.indexOf(ch) < 0);
  if (bad) return msg(`"${bad}" isn't used in list codes. Codes never contain 0, O, I or l.`, true);
  if (raw.length % CODELEN !== 1 || raw.length < CODELEN + 1) return msg("That list code looks incomplete. Check that you copied all of it.", true);
  const body = raw.slice(0, -1);
  if (chk(body) !== raw.slice(-1)) return msg("That list code has a typo in it. Check that you copied it exactly.", true);
  const ids = [];
  for (let k = 0; k < body.length; k += CODELEN) {
    let n = 0n; for (const ch of body.slice(k, k + CODELEN)) n = n * 58n + BigInt(ALPHA.indexOf(ch));
    if (n >= TOTAL) return msg("That list code doesn't match any characters.", true);
    ids.push(n);
  }
  let added = 0;
  for (const id of ids) if (!saved.some(c => c.id === id.toString())) { saved.push(summarize(id)); added++; }
  persist(); renderSaved();
  msg(`Added ${added} character${added === 1 ? "" : "s"}${added < ids.length ? ` (${ids.length - added} already in your list)` : ""}.`);
  if (added) $("listIn").value = "";
}
$("loadList").onclick = loadList;
$("listIn").onkeydown = e => { if (e.key === "Enter") loadList(); };
$("load").onclick = loadNumber;
$("numIn").onkeydown = e => { if (e.key === "Enter") loadNumber(); };
$("spin").onclick = spin;
$("spinAll").onclick = () => {
  if (busy) return;
  for (let i = 0; i < W.length; i++) {
    if (res[i] !== undefined) continue;
    opts(i);
    res[i] = skipped(i) ? -1 : Math.random() * W[i].o.length | 0;
  }
  rows(); finish();
};
$("again").onclick = () => { curId = null; $("save").disabled = true; renderSaved(); $("numErr").hidden = true; $("decNum").hidden = true; res = []; cur = 0; $("again").hidden = true; $("charNum").hidden = true; $("stage").hidden = false; rows(); show(); };
$("copy").onclick = e => {
  let t = [...$("rows").children].reduce((s, el, i) => s + el.textContent + (i % 2 ? "\n" : ": "), "");
  if (!$("charNum").hidden) t += $("charNum").textContent;
  navigator.clipboard?.writeText(t).then(() => { e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy character", 1200); });
};
rows(); show(); renderSaved();
</script>
